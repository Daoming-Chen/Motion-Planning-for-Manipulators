name: Build and Deploy Quarto Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node.js dependencies
        run: |
          npm install

      - name: Build web demos with Vite
        run: |
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install jupyter numpy matplotlib scipy plotly pandas

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.550

      - name: Render Quarto book
        run: |
          quarto render

      - name: Copy assets and web demos into build output
        run: |
          if [ -d notebooks/assets ]; then
            mkdir -p _build/html/assets
            cp -R notebooks/assets/. _build/html/assets/
          fi
          if [ -d dist/web_demos ]; then
            mkdir -p _build/html/web_demos
            cp -R dist/web_demos/. _build/html/web_demos/
          fi
          if [ -d models ]; then
            mkdir -p _build/html/models
            cp -R models/. _build/html/models/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          force_orphan: true
