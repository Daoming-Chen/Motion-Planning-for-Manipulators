project:
  type: book
  output-dir: _build/html

book:
  title: "Motion Planning for Manipulators"
  author: "Daoming Chen"
  repo-url: https://github.com/Daoming-Chen/Motion-Planning-for-Manipulators
  repo-actions: [edit, issue]
  chapters:
    - index.ipynb
    - notebooks/00_intro.ipynb
    - notebooks/01_kinematics.ipynb
    - test.ipynb
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    code-tools: true
    embed-resources: true
    # embed-resources bundles JS/CSS (including plotly.js and widget manager) into the HTML

# Enable Jupyter widgets so ipywidgets/FigureWidget remain interactive after render
jupyter:
  widgets: true
